syntax = "proto3";
package game_service.api.commands;
import "google/protobuf/any.proto";

message CreateGameCommand
{
  message Request
  {
    repeated google.protobuf.Any options = 1;
    string signature = 2; 
  }
  
  message Response
  {
    message Success
    {
      string game_id = 1;
    }
    
    message InvalidSignature {};
    
    oneof result
    {
      Success success = 1;
      InvalidSignature invalid_signature = 2;
    }
  }
}

message GetGameAccessTokenCommand
{
  message Request
  {
    string game_id = 1;
  }
  
  message Response
  {
    message Success
    {
      string access_token = 1;
    }

    oneof result
    {
      Success success = 1;
    }
  }
}

message GetGameEventsCommand
{
  message Request
  {
    string game_id = 1;
  }
  
  message StreamResponse
  {
    message OldEvent
    {
      google.protobuf.Any event = 1;
    }

    message OldEventsEnded
    {}

    message NewEvent
    {
      google.protobuf.Any event = 1; 
    }

    oneof result
    {
      OldEvent old_event = 1;
      OldEventsEnded old_events_ended = 2;
      NewEvent new_event = 3;
    }
  }
}

message JoinLobbyCommand
{
  message Request
  {
    string access_token = 1;
  }

  message Response
  {
    message Success {};
    
    message InvalidAccessToken {};
    
    oneof result
    {
      Success success = 1;
      InvalidAccessToken invalid_access_token = 2;
    }
  }
}

message PlayAttackCardCommand
{
  message Request
  {
    string access_token = 1;
    string card_id = 2;
  }

  message Response
  {
    message Success {};

    message InvalidAccessToken {};

    oneof result
    {
      Success success = 1;
      InvalidAccessToken invalid_access_token = 2;
    }
  }
}

message BeatAttackCardCommand
{
  message Request
  {
    string access_token = 1;
    string attacker_card_id = 2;
    string defender_card_id = 3;
  }

  message Response
  {
    message Success {};

    message InvalidAccessToken {};

    oneof result
    {
      Success success = 1;
      InvalidAccessToken invalid_access_token = 2;
    }
  }
}

message GiveUpDefenceCommand
{
  message Request
  {
    string access_token = 1;
  }

  message Response
  {
    message Success {};

    message InvalidAccessToken {};

    oneof result
    {
      Success success = 1;
      InvalidAccessToken invalid_access_token = 2;
    }
  }
}