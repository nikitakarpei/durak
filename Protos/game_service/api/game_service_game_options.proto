syntax = "proto3";
package game_service.api.data.game_options;
import "google/protobuf/duration.proto";
import "game_service_data.proto";

message AmountOfPlayers
{
  int32 count = 1;
}

message CardRanksInTalon
{
  repeated data.CardRank ranks = 1;
}

message MinHandSize
{
  int32 count = 1;
}

message PlayerAfkTimerDuration
{
  google.protobuf.Duration duration = 1;
}